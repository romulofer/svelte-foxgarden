[package]
name = "foxgarden-svelte"
version.workspace = true
edition.workspace = true
description = "Svelte support for FoxGarden, as an extension"

[lib]
name = "foxgarden_svelte"
path = "src/lib.rs"

# Reaches the editor only through `fg-extension`, like `foxgarden-spring` and
# `foxgarden-kmp`; it must not depend on `fg-core` or `syntax`.
[dependencies]
fg-extension = { path = "../../../foxgarden/crates/extension" }
tree-sitter = "0.26.11"
tree-sitter-svelte-ng = "1.0.2"
# A Svelte grammar extends HTML's, and its highlight query builds on HTML's.
tree-sitter-html = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
